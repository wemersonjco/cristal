<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6b63">
<title>Portaria Fácil</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="left"><h1>Portaria Fácil</h1><span id="condoName"></span></div>
      <div id="userbox" hidden></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seções" hidden></nav>
  </div>
</header>
<main class="wrap">
  <div id="banner"></div>
  <div class="tiles" id="tiles" hidden></div>
  <div id="view"><p class="hint">Carregando…</p></div>
</main>
<div id="overlay"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
